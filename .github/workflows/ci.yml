name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor `requires-python` sets: `paddock init` needs tomllib to
        # parse the config it is about to write, and a skipped check is no check.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Lint the install script
        run: shellcheck install.sh

      - name: Test
        run: uv run pytest -q

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for diagrams
        id: check
        run: |
          if compgen -G "docs/diagrams/*.puml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .puml files under docs/diagrams/, skipping."
          fi

      - name: Install PlantUML
        if: steps.check.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends plantuml

      - name: Validate PlantUML sources
        if: steps.check.outputs.found == 'true'
        run: plantuml -checkonly docs/diagrams/*.puml
