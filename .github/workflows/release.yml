name: Release

# Push a `v*` tag to cut a release. Run it by hand (workflow_dispatch) to build
# and check the artifacts without releasing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only. Publish nothing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! ls dist/*-"$version"-*.whl > /dev/null 2>&1; then
            echo "Tag $GITHUB_REF_NAME does not match what was built:"
            ls dist/
            echo "Bump the version in pyproject.toml and paddock/__init__.py, then retag."
            exit 1
          fi

      - name: Check the artifacts
        run: uvx twine check dist/*

      - name: Summary
        run: |
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls dist/ | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    # A push of the tag, or a manual run on the tag with dry_run off. On a push
    # `github.event.inputs.dry_run` is empty, so the second test passes.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  pypi:
    name: Publish to PyPI
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: no API token is stored anywhere
    steps:
      - name: Not configured yet
        if: vars.PYPI_PUBLISH != 'true'
        run: |
          echo "PyPI publishing is off: the PYPI_PUBLISH repository variable is not 'true'." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "docs/RELEASING.md says how to turn it on. The GitHub release above still stands." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        if: vars.PYPI_PUBLISH == 'true'
        with:
          name: dist
          path: dist

      - name: Publish
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
