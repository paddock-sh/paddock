[project]
name = "paddock"
version = "0.1.0"
description = "Sandboxed agent sessions for herdr: per-pane tool, network, and filesystem permissions"
requires-python = ">=3.10"
dependencies = [
    # The screens are prompt_toolkit Applications of our own, and it is the only one.
    "prompt-toolkit>=3.0",
]

[project.scripts]
paddock = "paddock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddock"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
